<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Velvet & Vine</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/logo.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./CSS/fonts.css" />
        <link rel="stylesheet" href="./CSS/variables.css" />
        <link rel="stylesheet" href="./CSS/main.css" />
        <link rel="stylesheet" href="./CSS/basket.css" />
        <link rel="stylesheet" href="./CSS/media-queries.css" />
        <link rel="stylesheet" href="./CSS/media-queries-basket.css" />
        <script defer src="./JS/dishes.js"></script>
        <script defer src="./JS/templates.js"></script>
        <script defer src="./script.js"></script>
    </head>
    <body class="column" onload="init()">
        <header class="main-padding header">
            <a href="./index.html"
                ><img src="./assets/icon/logo-name-short.png" alt="Logo V & V"
            /></a>
            <button class="menu-button" aria-label="Open menu"></button>
        </header>
        <main class="column">
            <section class="landing-section column">
                <img
                    class="background-img"
                    src="./assets/img/background-image.jpg"
                    alt="Logo"
                />
                <img class="logo-img" src="./assets/icon/logo.png" alt="Logo" />
                <div class="landing-text">
                    <div class="headline-div">
                        <h1>Velvet & Vine</h1>
                        <div class="reviews">
                            <img
                                src="./assets/icon/review-star.png"
                                alt="Star-Icon"
                            />
                            <p>4,3 <span>(397)</span></p>
                        </div>
                    </div>
                    <p>A little taste of Italy, wherever you are.</p>
                </div>
            </section>
            <section class="menu-section menu-padding">
                <section class="dish-section">
                    <ul id="dishList" class="dish-list column"></ul>
                </section>
                <section class="basket-section">
                    <dialog id="basket-dialog" class="basket">
                        <header>
                            <h2>Your Basket</h2>
                            <button aria-label="Close Basket" class="close-basket-button" onclick="closeDialog()"></button>
                        </header>
                        <ul id="basketContent" class="order-list column"></ul>
                        <div
                            id="basketSummary"
                            class="basket-summary column"
                        ></div>
                    </dialog>
                </section>
            </section>
        </main>
        <footer class="main-padding">
            <div class="copyright-logo">
                <p>© 2026</p>
                <img
                    src="./assets/icon/logo-name-full.png"
                    alt="Logo Velvet & Vine"
                />
            </div>
            <ul class="footer-links">
                <li><a href="./HTML/imprint.html">Imprint</a></li>
                <li><a href="">Cookie Preferences</a></li>
            </ul>
        </footer>
        <nav>
            <ul>
                <li>
                    <a href="./index.html"
                        ><button class="home-button nav-button"></button
                    ></a>
                </li>
                <li>
                    <button class="profile-button nav-button"></button>
                </li>
                <li>
                    <button class="takeout-button nav-button"></button>
                </li>
                <li>
                    <button class="cart-button nav-button" onclick="openDialog()"></button>
                </li>
            </ul>
        </nav>
    </body>
</html>
