<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Velvet & Vine</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/logo.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./CSS/fonts.css" />
        <link rel="stylesheet" href="./CSS/variables.css" />
        <link rel="stylesheet" href="./CSS/main.css" />
        <link rel="stylesheet" href="./CSS/basket.css" />
        <script defer src="./JS/dishes.js"></script>
        <script defer src="./JS/templates.js"></script>
        <script defer src="./script.js"></script>
    </head>
    <body class="column">
        <header>
            <img src="./assets/icon/logo-name-short.png" alt="Logo V & V" />
            <button class="menu-button" aria-label="Open menu"></button>
        </header>
        <main>
            <section class="landing-section column">
                <img class="background-img" src="./assets/img/background-image.jpg" alt="Logo" />
                <img class="logo-img" src="./assets/icon/logo.png" alt="Logo" />
                <div class="headline-div">
                    <h1>Velvet & Vine</h1>
                    <div class="reviews">
                        <img
                            src="./assets/icon/review-star.png"
                            alt="Star-Icon"
                        />
                        <p>4,3 <span>(397)</span></p>
                    </div>
                </div>
                <p>A little taste of Italy, wherever you are.</p>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
