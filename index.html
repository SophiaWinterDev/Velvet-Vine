<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Velvet & Vine</title>
        <link
            rel="shortcut icon"
            href="./assets/icon/logo.png"
            type="image/x-icon"
        />

        <link rel="stylesheet" href="./style.css" />
        <link rel="stylesheet" href="./CSS/fonts.css" />
        <link rel="stylesheet" href="./CSS/variables.css" />
        <link rel="stylesheet" href="./CSS/main.css" />
        <link rel="stylesheet" href="./CSS/basket.css" />
        <link rel="stylesheet" href="./CSS/media-queries.css" />
        <link rel="stylesheet" href="./CSS/media-queries-basket.css" />
        <script defer src="./JS/dishes.js"></script>
        <script defer src="./JS/templates.js"></script>
        <script defer src="./script.js"></script>
    </head>
    <body class="column" onload="init()">
        <header class="main-padding header">
            <a href="./index.html"
                ><img
                    src="./assets/icon/logo-name-short.png"
                    alt="Velvet & Vine — Home"
            /></a>
            <button class="menu-button" aria-label="Open menu"></button>
        </header>
        <main class="column main">
            <section class="landing-section column">
                <img
                    class="background-img"
                    src="./assets/img/background-image.jpg"
                    alt=""
                />
                <img class="logo-img" src="./assets/icon/logo.png" alt="" />
                <div class="landing-text">
                    <div class="headline-div">
                        <h1>Velvet & Vine</h1>
                        <div class="reviews">
                            <img
                                src="./assets/icon/review-star.png"
                                alt="Star-Icon"
                            />
                            <p>4,3 <span>(397)</span></p>
                        </div>
                    </div>
                    <p>A little taste of Italy, wherever you are.</p>
                </div>
            </section>
            <section class="main-padding">
                <ul class="category-list">
                    <li>
                        <a href="#categoryStarters">Starters</a>
                    </li>
                    <li>
                        <a href="#categoryPasta">Pasta</a>
                    </li>
                    <li>
                        <a href="#categoryPizza">Pizza</a>
                    </li>
                    <li>
                        <a href="#categoryDesserts">Desserts</a>
                    </li>
                </ul>
            </section>
            <section class="menu-section menu-padding">
                <section id="dishSection" class="dish-section column"></section>
                <section class="basket-section">
                    <dialog
                        id="basketDialog"
                        class="basket"
                        onclick="closeBasketDialog()"
                    >
                        <header onclick="bubblingPrevention(event)">
                            <h3>Your Basket</h3>
                            <button
                                aria-label="Close Basket"
                                class="close-basket-button"
                                onclick="closeBasketDialog()"
                            ></button>
                        </header>
                        <ul
                            id="basketContent"
                            class="order-list column"
                            onclick="bubblingPrevention(event)"
                        ></ul>
                        <div
                            id="basketSummary"
                            class="basket-summary column"
                            onclick="bubblingPrevention(event)"
                        ></div>
                    </dialog>
                </section>
            </section>
            <dialog
                id="confirmationDialog"
                class="confirmation-dialog"
                onclick="closeConfirmationDialog()"
            >
                <header onclick="bubblingPrevention(event)">
                    <button
                        aria-label="Close confirmation message"
                        class="close-button"
                        onclick="closeConfirmationDialog()"
                    ></button>
                </header>
                <main onclick="bubblingPrevention(event)">
                    <img src="./assets/icon/delivery.png" alt="" />
                    <h3>Order confirmed!</h3>
                    <p>Your food is on the way!</p>
                </main>
            </dialog>
        </main>
        <footer class="main-padding">
            <div class="copyright-logo">
                <p>© 2026</p>
                <img
                    src="./assets/icon/logo-name-full.png"
                    alt="Logo Velvet & Vine"
                />
            </div>
            <ul class="footer-links">
                <li><a href="./HTML/imprint.html">Imprint</a></li>
                <li><a href="">Cookie Preferences</a></li>
            </ul>
        </footer>
        <nav>
            <ul>
                <li>
                    <a
                        href="./index.html"
                        class="home-button nav-button"
                        aria-label="Home"
                    ></a>
                </li>
                <li>
                    <button
                        class="profile-button nav-button"
                        aria-label="Profile"
                    ></button>
                </li>
                <li>
                    <button
                        class="takeout-button nav-button"
                        aria-label="Takeout"
                    ></button>
                </li>
                <li class="cart-button-wrapper">
                    <button
                        class="cart-button nav-button"
                        aria-label="Open basket"
                        onclick="openBasketDialog()"
                    ></button>
                    <p id="cartAmountBubble">0</p>
                </li>
            </ul>
        </nav>
    </body>
</html>
